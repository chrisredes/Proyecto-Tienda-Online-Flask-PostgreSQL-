{% extends "base.html" %}

{% block titulo %}Nueva Mercancía | TicketNow{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <a href="{{ url_for('listar_mercancias') }}" class="btn btn-outline-secondary mb-3">← Volver al catálogo</a>

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h2 class="mb-4 fw-bold">👕 Registrar Nueva Mercancía</h2>

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre del Producto</label>
                        <input type="text" class="form-control" name="nombre" placeholder="Ej. Camiseta Oficial Tour" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Descripción</label>
                        <textarea class="form-control" name="descripcion" rows="3" placeholder="Detalles de talla, material, etc."></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Precio Base ($)</label>
                            <input type="number" step="0.01" class="form-control" name="precio" placeholder="25.00" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold">Stock Inicial</label>
                            <input type="number" class="form-control" name="stock" placeholder="50" min="0" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 mt-2">Guardar Mercancía</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
